<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pour toi, Ky Dinkou Nafissata 💌</title>
  <meta property="og:title"       content="J'ai une question importante à te poser… 💌">
  <meta property="og:description" content="Ouvre ce lien, j'ai quelque chose à te dire...">
  <meta name="theme-color"        content="#090205">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ══ PALETTE ══ */
    :root {
      --bg:      #090205;
      --wine:    #4a0a22;
      --rose-d:  #9b1042;
      --rose:    #c8184f;
      --gold:    #c9a84c;
      --gold-lt: #f0d57a;
      --cream:   #fdf3e0;
      --blush:   #ffb3c6;
      --plum:    #200810;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      min-height: 100%;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--cream);
      background:
        radial-gradient(ellipse 90% 55% at 50%   0%,  rgba(155,16,66,.50) 0%, transparent 65%),
        radial-gradient(ellipse 70% 50% at 15% 100%,  rgba(92,10,35,.40)  0%, transparent 60%),
        radial-gradient(ellipse 60% 45% at 85%  90%,  rgba(74,0,28,.45)   0%, transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, #12060e 50%, var(--bg) 100%);
      overflow-x: hidden;
      position: relative;
    }

    /* ══ PÉTALES ══ */
    #petalsLayer {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .petal {
      position: absolute; top: -30px;
      animation: fall-petal linear both;
      will-change: transform, opacity;
      user-select: none;
    }
    @keyframes fall-petal {
      0%   { transform: translateY(0)      rotate(0deg);   opacity: .85; }
      85%  { opacity: .5; }
      100% { transform: translateY(115vh) rotate(480deg); opacity: 0;   }
    }

    /* ══════════════════════════════════════════════
       VUE 1 — QUESTION
    ══════════════════════════════════════════════ */
    #ask-view {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(32px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
    }
    #ask-view.hidden { display: none; }

    .ask-card {
      width: min(380px, 94vw);
      background: rgba(20, 4, 12, 0.72);
      border: 1px solid rgba(201,168,76,.35);
      border-radius: 28px;
      padding: 42px 28px 36px;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(201,168,76,.10),
        0 24px 60px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(8px);
      animation: pop-in .6s cubic-bezier(.2,.9,.3,1.2) both;
    }
    @keyframes pop-in {
      from { opacity:0; transform: scale(.88) translateY(24px); }
      to   { opacity:1; transform: scale(1)   translateY(0);    }
    }

    /* Icône / emoji du haut */
    .ask-emoji {
      font-size: 58px;
      display: block;
      margin-bottom: 16px;
      filter: drop-shadow(0 6px 14px rgba(200,24,79,.4));
      transition: all .3s ease;
    }

    /* Question */
    .ask-question {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(28px, 8.5vw, 38px);
      color: var(--gold-lt);
      line-height: 1.25;
      margin-bottom: 8px;
      text-shadow: 0 0 22px rgba(240,213,122,.40), 0 2px 6px rgba(0,0,0,.6);
    }

    /* Note (sous-titre) */
    .ask-note {
      font-style: italic;
      font-size: clamp(13px, 3.8vw, 15px);
      color: var(--blush);
      margin-bottom: 28px;
      min-height: 20px;
      opacity: .85;
    }

    /* Séparateur */
    .ask-divider {
      font-size: 12px;
      letter-spacing: 8px;
      color: var(--gold);
      opacity: .5;
      margin-bottom: 26px;
      display: block;
    }

    /* Zone boutons */
    .btn-zone {
      display: flex;
      gap: 14px;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 60px;
    }

    /* Bouton OUI */
    .btn-oui {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      border: none;
      cursor: pointer;
      border-radius: 999px;
      padding: 15px 28px;
      font-size: 17px;
      touch-action: manipulation;
      background: linear-gradient(135deg, var(--rose), #e05a30);
      color: #fff;
      box-shadow: 0 10px 28px -8px rgba(200,24,79,.70);
      transform: scale(var(--oui-scale, 1));
      transition: transform .35s cubic-bezier(.2,.9,.3,1.3), box-shadow .3s ease;
    }
    .btn-oui:active { filter: brightness(1.1); }
    .btn-oui:focus-visible { outline: 3px solid var(--gold-lt); outline-offset: 3px; }

    /* Bouton NON */
    .btn-non {
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      border: 2px solid rgba(201,168,76,.50);
      cursor: pointer;
      border-radius: 999px;
      padding: 13px 22px;
      font-size: 16px;
      touch-action: manipulation;
      background: transparent;
      color: var(--gold);
      transform: scale(var(--non-scale, 1));
      transition: transform .32s cubic-bezier(.2,.9,.3,1.3), left .28s ease, top .28s ease, opacity .3s ease;
    }
    .btn-non:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    /* Ornement bas de la carte */
    .ask-orn {
      margin-top: 22px;
      font-size: 11px;
      letter-spacing: 8px;
      color: var(--gold);
      opacity: .4;
      display: block;
    }

    /* ══════════════════════════════════════════════
       VUE 2 — DÉCLARATION (cadeau)
    ══════════════════════════════════════════════ */
    #gift-view {
      position: relative; z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        max(40px, env(safe-area-inset-top))
        20px
        max(52px, env(safe-area-inset-bottom));
    }
    #gift-view.hidden { display: none; }

    /* Animation d'apparition de la déclaration */
    .gift-card {
      width: min(400px, 95vw);
      text-align: center;
      animation: reveal 1.4s cubic-bezier(.2,.85,.3,1.05) both;
    }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(60px) scale(.92); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    .orn { font-size: 13px; letter-spacing: 12px; color: var(--gold); opacity: .75; margin-bottom: 26px; display: block; }

    /* ── CŒUR ── */
    .heart-wrap {
      position: relative;
      width: min(340px, 88vw);
      aspect-ratio: 340 / 310;
      margin: 0 auto 22px;
      filter:
        drop-shadow(0  0  22px rgba(200,24,79,.70))
        drop-shadow(0  0  55px rgba(200,24,79,.35))
        drop-shadow(0 14px 35px rgba(0,0,0,.60));
    }
    .heart-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

    .center-heart {
      position: absolute;
      top: 36%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(20px, 6vw, 28px);
      animation: beat 1.6s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(200,24,79,.9));
      z-index: 2; pointer-events: none;
    }
    @keyframes beat {
      0%,100% { transform: translate(-50%,-50%) scale(1);    }
      30%      { transform: translate(-50%,-50%) scale(1.28); }
      60%      { transform: translate(-50%,-50%) scale(1.08); }
    }

    .h-spark {
      position: absolute; pointer-events: none; z-index: 2;
      animation: twinkle 2.4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0; transform: scale(.35) rotate(0deg);   }
      50%      { opacity: 1; transform: scale(1)   rotate(200deg); }
    }

    /* ── Textes ── */
    .divider { font-size: 13px; letter-spacing: 8px; color: var(--gold); opacity: .65; margin: 10px 0; display: block; }

    .name {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(38px, 11.5vw, 54px);
      color: var(--gold-lt); line-height: 1.18;
      margin: 8px 0 20px;
      text-shadow: 0 0 28px rgba(240,213,122,.50), 0 3px 8px rgba(0,0,0,.65);
    }

    .msg {
      font-style: italic; font-weight: 300;
      font-size: clamp(19px, 5.6vw, 25px);
      line-height: 1.80; color: var(--cream);
      padding: 0 10px; margin-bottom: 26px;
      text-shadow: 0 1px 5px rgba(0,0,0,.45);
    }
    .msg .accent {
      display: block; font-style: normal; font-weight: 500;
      font-size: 1.14em; color: var(--blush);
      text-shadow: 0 0 18px rgba(255,179,198,.4), 0 2px 6px rgba(0,0,0,.5);
    }

    .sig-label { font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); opacity: .6; margin-bottom: 6px; display: block; }
    .sig-name  { font-family: 'Playfair Display', serif; font-size: clamp(13px, 3.8vw, 16px); font-weight: 700; letter-spacing: 2.5px; color: var(--gold); text-shadow: 0 0 14px rgba(201,168,76,.40); display: block; }

    .seal { display: inline-block; margin-top: 26px; font-size: clamp(38px, 10vw, 48px); animation: pulse-seal 2.6s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(255,179,198,.5)); }
    @keyframes pulse-seal { 0%,100% { transform: scale(1); } 50% { transform: scale(1.13); } }
    .orn-bot { display: block; margin-top: 14px; font-size: 12px; letter-spacing: 12px; color: var(--gold); opacity: .45; }

    /* ── Pluie de cœurs sur "Oui" ── */
    .hearts-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
    .hrt {
      position: absolute; top: -40px;
      animation: fall-hrt linear forwards;
    }
    @keyframes fall-hrt {
      to { transform: translateY(112vh) rotate(360deg); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .petal, .h-spark, .center-heart, .seal, .hrt { animation: none !important; }
      .gift-card { animation: none !important; opacity: 1; }
    }
  </style>
</head>
<body>

<!-- Pétales -->
<div id="petalsLayer" aria-hidden="true"></div>
<!-- Pluie de cœurs (activée sur Oui) -->
<div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

<!-- ══════════════════════════════════════════
     VUE 1 : QUESTION
══════════════════════════════════════════ -->
<section id="ask-view" role="main">
  <div class="ask-card">

    <span class="ask-emoji" id="askEmoji">🥺</span>

    <h1 class="ask-question" id="askQuestion" aria-live="polite">
      Veux-tu être ma copine ?
    </h1>
    <p class="ask-note" id="askNote"></p>

    <span class="ask-divider" aria-hidden="true">— ♥ —</span>

    <div class="btn-zone" id="btnZone">
      <button class="btn-oui" id="ouiBtn">Oui 💕</button>
      <button class="btn-non" id="nonBtn">Non</button>
    </div>

    <span class="ask-orn" aria-hidden="true">✦ &nbsp; ✦ &nbsp; ✦</span>
  </div>
</section>

<!-- ══════════════════════════════════════════
     VUE 2 : DÉCLARATION (s'ouvre sur Oui)
══════════════════════════════════════════ -->
<section id="gift-view" class="hidden" aria-label="Message de déclaration">
  <div class="gift-card">

    <span class="orn" aria-hidden="true">✦ &nbsp; ✦ &nbsp; ✦</span>

    <!-- GRAND CŒUR -->
    <div class="heart-wrap" aria-label="Cœur avec nos photos">
      <svg class="heart-svg" viewBox="0 0 340 310"
           xmlns="http://www.w3.org/2000/svg"
           xmlns:xlink="http://www.w3.org/1999/xlink"
           aria-hidden="true">
        <defs>
          <clipPath id="hClip">
            <path d="M 170 295
                     C 170 295, 22 192, 22  93
                     Q  22  15,  93  15
                     Q 133  15, 170  55
                     Q 207  15, 247  15
                     Q 318  15, 318  93
                     C 318 192, 170 295, 170 295 Z"/>
          </clipPath>
          <linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="70%" stop-color="transparent"/>
            <stop offset="100%" stop-color="rgba(9,2,5,0.45)"/>
          </linearGradient>
          <linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"  stop-color="rgba(9,2,5,0.45)"/>
            <stop offset="30%" stop-color="transparent"/>
          </linearGradient>
          <radialGradient id="vign" cx="50%" cy="45%" r="70%">
            <stop offset="55%" stop-color="transparent"/>
            <stop offset="100%" stop-color="rgba(9,2,5,0.55)"/>
          </radialGradient>
          <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Photo gauche : KY DINKOU NAFISSATA -->
        <image href="Photo_femme.jpeg" xlink:href="Photo_femme.jpeg"
               x="0" y="0" width="170" height="310"
               preserveAspectRatio="xMidYMin slice"
               clip-path="url(#hClip)"/>
        <rect x="0" y="0" width="170" height="310"
              fill="url(#fadeR)" clip-path="url(#hClip)"/>

        <!-- Photo droite : WENDYAM -->
        <image href="photo-lui.jpg" xlink:href="photo-lui.jpg"
               x="170" y="0" width="170" height="310"
               preserveAspectRatio="xMidYMin slice"
               clip-path="url(#hClip)"/>
        <rect x="170" y="0" width="170" height="310"
              fill="url(#fadeL)" clip-path="url(#hClip)"/>

        <!-- Vignette -->
        <path d="M 170 295 C 170 295, 22 192, 22 93 Q 22 15, 93 15 Q 133 15, 170 55 Q 207 15, 247 15 Q 318 15, 318 93 C 318 192, 170 295, 170 295 Z"
              fill="url(#vign)"/>

        <!-- Ligne or centrale -->
        <line x1="170" y1="28" x2="170" y2="276"
              stroke="#c9a84c" stroke-width="1.2" opacity="0.55"
              clip-path="url(#hClip)"/>

        <!-- Bordure or lumineuse -->
        <path d="M 170 295 C 170 295, 22 192, 22 93 Q 22 15, 93 15 Q 133 15, 170 55 Q 207 15, 247 15 Q 318 15, 318 93 C 318 192, 170 295, 170 295 Z"
              fill="none" stroke="#c9a84c" stroke-width="3.5"
              filter="url(#goldGlow)" opacity=".90"/>
      </svg>

      <span class="center-heart" aria-hidden="true">❤️</span>

      <span class="h-spark" style="top:5%;left:13%;font-size:16px;animation-delay:0s"     aria-hidden="true">✨</span>
      <span class="h-spark" style="top:5%;right:13%;font-size:13px;animation-delay:.9s"   aria-hidden="true">✨</span>
      <span class="h-spark" style="top:50%;left:3%;font-size:12px;animation-delay:1.7s"   aria-hidden="true">💫</span>
      <span class="h-spark" style="top:50%;right:3%;font-size:12px;animation-delay:.5s"   aria-hidden="true">💫</span>
      <span class="h-spark" style="top:74%;left:20%;font-size:10px;animation-delay:1.3s"  aria-hidden="true">🌸</span>
      <span class="h-spark" style="top:74%;right:20%;font-size:10px;animation-delay:2.1s" aria-hidden="true">🌸</span>
    </div>

    <span class="divider" aria-hidden="true">— ♥ —</span>

    <h1 class="name">Ky Dinkou<br>Nafissata</h1>

    <p class="msg">
      Je veux faire de toi<br>
      <span class="accent">la mère de mes enfants</span>
    </p>

    <span class="divider" aria-hidden="true">· &thinsp; · &thinsp; · &thinsp; · &thinsp; ·</span>

    <span class="sig-label">De la part de</span>
    <span class="sig-name">Sawadogo Wendyam Damien</span>

    <span class="seal" role="img" aria-label="Bague">💍</span>
    <span class="orn-bot" aria-hidden="true">✦ &nbsp; ✦ &nbsp; ✦</span>

  </div>
</section>

<script>
  /* ══ ÉTAPES DU BOUTON NON ══ */
  const stages = [
    { emoji:'🥺', question:'Veux-tu être ma copine ?',               note:'',                                        ouiScale:1,    nonScale:1,    hideNon:false },
    { emoji:'😅', question:'Tu as dû cliquer sur « non » par erreur, non ?', note:'ça arrive à tout le monde',      ouiScale:1.15, nonScale:0.85, hideNon:false },
    { emoji:'🥹', question:'Tu es vraiment, vraiment sûre ?',        note:'réfléchis bien avant de répondre',        ouiScale:1.40, nonScale:0.65, hideNon:false },
    { emoji:'😢', question:'Allez, s\'il te plaît...',               note:'dernière chance avant qu\'il disparaisse', ouiScale:1.75, nonScale:0.38, hideNon:false },
    { emoji:'😌', question:'Il n\'y a plus de bouton « non ».',      note:'relis bien la question ✨',                ouiScale:2.1,  nonScale:0,    hideNon:true  }
  ];

  let idx = 0;

  const askView    = document.getElementById('ask-view');
  const giftView   = document.getElementById('gift-view');
  const emojiEl    = document.getElementById('askEmoji');
  const questionEl = document.getElementById('askQuestion');
  const noteEl     = document.getElementById('askNote');
  const ouiBtn     = document.getElementById('ouiBtn');
  const nonBtn     = document.getElementById('nonBtn');
  const btnZone    = document.getElementById('btnZone');
  const heartsLayer= document.getElementById('heartsLayer');
  const petalsLayer= document.getElementById('petalsLayer');

  /* ── Rendu d'une étape ── */
  function render() {
    const s = stages[idx];
    emojiEl.textContent    = s.emoji;
    questionEl.textContent = s.question;
    noteEl.textContent     = s.note;
    ouiBtn.style.setProperty('--oui-scale', s.ouiScale);
    nonBtn.style.setProperty('--non-scale', s.nonScale);
    nonBtn.style.opacity      = s.hideNon ? '0' : '1';
    nonBtn.style.pointerEvents= s.hideNon ? 'none' : 'auto';
  }

  /* ── Le bouton Non s'enfuit ── */
  function dodge() {
    if (stages[idx].hideNon) return;
    const zRect = btnZone.getBoundingClientRect();
    const nRect = nonBtn.getBoundingClientRect();
    const maxX  = Math.max(zRect.width  - nRect.width  - 20, 0);
    const maxY  = Math.max(zRect.height - nRect.height - 20, 0);
    nonBtn.style.position = 'absolute';
    nonBtn.style.left     = (Math.random() * maxX + 10) + 'px';
    nonBtn.style.top      = (Math.random() * maxY + 10) + 'px';
  }

  /* ── Avance d'une étape quand Non est cliqué ── */
  function advance() {
    if (idx < stages.length - 1) { idx++; render(); }
  }

  nonBtn.addEventListener('mouseenter', dodge);
  nonBtn.addEventListener('click', advance);
  nonBtn.addEventListener('touchstart', (e) => {
    if (stages[idx].hideNon) return;
    if (Math.random() < 0.72) { e.preventDefault(); dodge(); }
  }, { passive: false });

  /* ══ PLUIE DE CŒURS ══ */
  const glyphsHeart = ['💕','💖','💗','✨','🌸','❤️','💝'];
  function burstHearts() {
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const n = reduced ? 0 : 32;
    for (let i = 0; i < n; i++) {
      const h = document.createElement('span');
      h.className   = 'hrt';
      h.textContent = glyphsHeart[Math.floor(Math.random() * glyphsHeart.length)];
      h.setAttribute('aria-hidden','true');
      h.style.left              = Math.random() * 100 + '%';
      h.style.fontSize          = (16 + Math.random() * 22) + 'px';
      h.style.animationDuration = (2.4 + Math.random() * 2.4) + 's';
      h.style.animationDelay    = (Math.random() * 0.8) + 's';
      heartsLayer.appendChild(h);
      h.addEventListener('animationend', () => h.remove());
    }
  }

  /* ══ CLIC OUI → ouvre la déclaration ══ */
  ouiBtn.addEventListener('click', () => {
    burstHearts();
    /* Petit délai pour voir la pluie de cœurs commencer */
    setTimeout(() => {
      askView.classList.add('hidden');
      giftView.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 600);
  });

  /* ══ PÉTALES ══ */
  const glyphsPetal = ['🌹','🌸','💕','🌺','✨','💗','🥀','❤️','💖','🌷'];
  const reduced     = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function spawnPetal() {
    if (reduced) return;
    const p = document.createElement('span');
    p.className   = 'petal';
    p.textContent = glyphsPetal[Math.floor(Math.random() * glyphsPetal.length)];
    p.setAttribute('aria-hidden','true');
    p.style.left             = Math.random() * 100 + '%';
    p.style.fontSize         = (12 + Math.random() * 14) + 'px';
    const dur                = 7 + Math.random() * 9;
    p.style.animationDuration = dur + 's';
    p.style.animationDelay   = (Math.random() * 2.5) + 's';
    petalsLayer.appendChild(p);
    setTimeout(() => p.remove(), (dur + 3) * 1000);
  }

  for (let i = 0; i < 15; i++) setTimeout(spawnPetal, i * 300);
  setInterval(spawnPetal, 1300);

  /* Rendu initial */
  render();
</script>

</body>
</html>
